name: Import exact official AOSP17 system/vold source

on:
  push:
    branches:
      - port/a17-vold-import-20261104
    paths:
      - .github/workflows/aosp17-vold-import.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aosp17-vold-import
  cancel-in-progress: false

jobs:
  import-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_SHA: 6d20a0078c2bcaa2499dc5d032f337bfe1182d9e
      SOURCE_TREE: 8a39be56cc76830d199878b5ea854022a71d3af2
      TARGET_BRANCH: port/a17-vold-aosp17-base-20261104
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch exact official Google AOSP17 system/vold tag and verify commit/tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-vold"
          cd "$RUNNER_TEMP/aosp-vold"
          git init -q
          git remote add aosp https://android.googlesource.com/platform/system/vold
          git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none \
            aosp refs/tags/android-17.0.0_r1
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE"
          git cat-file -e "$SOURCE_TREE^{tree}"
          echo "PASS: official Google AOSP17 vold commit $SOURCE_SHA tree $SOURCE_TREE"

      - name: Publish isolated exact-tree root snapshot without modifying old PE
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aosp-vold"
          git remote add publish "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          ref="refs/heads/$TARGET_BRANCH"
          existing="$(git ls-remote --heads publish "$ref" | cut -f1)"
          if [ -n "$existing" ]; then
            git -c protocol.version=2 fetch --no-tags --depth=1 --filter=blob:none publish "$ref"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$SOURCE_TREE" || {
              echo "Target branch tree differs from official AOSP17; refusing overwrite"
              exit 1
            }
            echo "PASS: existing vold root snapshot has official Git tree"
            exit 0
          fi
          export GIT_AUTHOR_NAME="PixelExperience-Reborn CI"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          snapshot="$(printf 'vold: verified official AOSP17 exact-tree snapshot\n\nOriginal Google commit: %s\nOriginal Git tree: %s\nNo historical PE storage encryption backports included.\nOld Git ancestry intentionally not copied.\n' \
            "$SOURCE_SHA" "$SOURCE_TREE" | git commit-tree "$SOURCE_TREE")"
          test "$(git rev-parse "$snapshot^{tree}")" = "$SOURCE_TREE"
          git -c protocol.version=2 push --no-thin publish "$snapshot:$ref"
          test "$(git ls-remote --heads publish "$ref" | cut -f1)" = "$snapshot"
          echo "PASS: published verified AOSP17 vold snapshot $snapshot"
